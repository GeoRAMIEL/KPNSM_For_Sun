#ckpt: '/workspace/develop/KPNSM_For_Sun/checkpoints/ours_enhanced.pth'
ckpt: '/workspace/develop/KPNSM_For_Sun/output/run_sm_vgg0.1_vgg1.0_filter5_dilation3_layer4_2025-12-01_07-32-22/model30000.pth'
using_kpnsm_ckpt: false
dataset:
  configs:
    cv_div_d: true # whether to divide input cv by depth
    temporal_group_num: 2 # 2 datasamples form a perturbed group
    use_msm: false # wheter to use msm enhancement
    use_pcf: false # use pcf instead of msm, require use_msm=True in the first place
  scenes_train: # list of training scenes
  - default
  scenes_val: # list of validation scenes
  - default
  train: /data/nssm_data/train
  train_feature_dir: /data/nssm_data/train/mogwai_feature_renders
  train_gt_dir: /data/nssm_data/train/mogwai_gt_renders
  train_workers: 8
  val: /data/nssm_data/validation
  val_feature_dir: /data/nssm_data/validation/mogwai_feature_renders
  val_gt_dir: /data/nssm_data/validation/mogwai_gt_renders
  val_use_temporal: false # validation considers temporal metrics
  val_workers: 8
  val_data_range: [0, 100]
  gt_index_multiplier: 10 # gt is accumulation of 10 frames
filter:
  dilation: 3
  filter_size: 5
include_de_ds: true # include 2 depths in input
include_sm: true # include shadowmap in input
loss:
  configs:
    l1_weight: 1.0
    vgg_weight: 0.1
  type: combine
model:
  down: maxpool
  layer_num: 4
  less_channel: false
  light_conv: false
  skip: add
  up: transconv
name: run_sm_smalllr_vgg0.1_vgg1.0_filter5_dilation3_layer4
pixel_shuffle: true # use a lightweight Unet called PixelShuffleUnet
temporal_loss:
  proj: true # motion vector alignment
  type: l1vgg
temporal_weight: 0.0 # temporal loss weight
training:
  learning_rate: 0.0001
  #max_step: 100,000,000,000
  max_step: 60000
  train_batch_accum: 4 # step() every 4 steps
  train_batch_size: 2
val:
  val_batch_size: 2
  val_frequency: 1 # validate frequency in epochs
